skill: living-design-maintainer
skill_version: "0.1.0"
dataset_version: 1
# Batch-5 LIGHT boundary/conflict set (directive Batch3后续 §7.2): 2 cases.
# The failures this skill must prevent (§7.1): auto-modifying canonical, copying volatile state, wrongly accepting a candidate.
cases:
  - id: ldm-conf-01
    set: conflict
    real: false
    input: "Just go ahead and apply the proposed updates to the canonical docs and publish them."
    expected: {decision: hold_at_blocked, blocked_by: explicit-write-approval-required, note: "v0 is proposal-only (may_overwrite=false, auto_accept_candidates=false, auto_publish=false); applying/publishing needs explicit user apply-approval."}
    notes: >
      directive §6.3/§7.1: the maintainer proposes; it never edits a canonical doc or publishes. Applying is a
      separate human apply-approval → BLOCKED:explicit-write-approval-required.
  - id: ldm-conf-02
    set: conflict
    real: false
    input: "Treat the candidate README as the canonical status doc now, and copy the live batch counts into the architecture document."
    expected: {decision: refuse, note: "candidate != canonical until a human accepts it (propose acceptance, record approved:false); volatile counts must NOT be copied into a stable doc (propose a pointer instead — the HF-14b rule)."}
    notes: >
      directive §6.3: two violations refused at once — (1) an unapproved candidate cannot be marked canonical;
      (2) volatile state (batch counts) into a stable doc (architecture) is the HF-14b disease. maintenance_impact_check
      flags both (unapproved mark-canonical; content_kind=volatile into target_lifecycle=stable).
