skills:

  - name: documentation-quality-evaluator
    version: "0.3.0"
    status: experimental
    layer: L2-atomic
    class: evaluate
    owner: research-code-dev
    purpose: >
      Judge a documentation artifact against hard gates (HF-1..HF-15) + a weighted soft/roadmap rubric
      under a non-compensatory rule, run a two-layer no-context reader test, and emit a structured
      DOCUMENT_QUALITY/FACTUAL_VALIDITY verdict. Grades every other skill.
    invocation: orchestrator-only
    auto_trigger: false
    disable_model_invocation: true
    upstream_dependencies: []          # runs on any produced doc
    downstream_outputs: [quality-report, reader-test-report]
    conflicts: []                       # read-only gate; composes with all
    replaces: null
    replaced_by: null
    write_scope: {read_only: true, creates_new_files: true, may_overwrite: false, may_move: false, may_delete: false, requires_user_approval: false, requires_isolated_branch: false}
    context_budget: {default_reads: [target-doc, harness/rubric.md, harness/hard-fail.md, harness/canonical-source-map.md], max_scope: "the doc(s) under review + their cited sources", whole_repo_allowed: false}
    required_tools: [Read, Grep, Glob, Bash]     # Bash only to run deterministic checkers
    norm_sources: []
    status_vocab: true
    license_sources:
      - {method: "compact SKILL structure", src: "mattpocock/skills@snapshot writing-great-skills", license: MIT, adoption: method-borrow}
      - {method: "hard-gate vs soft-score separation", src: "design-guide §14.10", license: internal, adoption: adapt}
      - {method: "severity taxonomy + reverse-outline", src: "addyosmani/agent-skills code-review-and-quality + research-paper-writing", license: MIT, adoption: method-borrow}
      - {method: "two-pass adversarial reader", src: "addyosmani/agent-skills doubt-driven-development", license: MIT, adoption: method-borrow}
      - {method: "HF-13/14/15 + HF-12A-E + non-compensatory + structured verdict + 5 signal checkers", src: "reports/documentation-quality-evaluator_独立检查失败复盘与升级要求.md (v0.3 audit)", license: internal, adoption: adapt}
    evals: {trigger: pass, conflict: pass, task_quality: "partial (anchor golden-negative FAIL recall=1.0/false_pass=0 + B1 over-strictness PASS; full N/P/B suite + ablation deferred to v0.4)", reader_test: "protocol authored + anchor reader-failures specified; full standalone run deferred to v0.4"}
    last_evaluated: "2026-07-30"
    notes: "v0.3: fixed a hybrid-roadmap FALSE-PASS. Anchor (eoopt roadmap) now FAILs with HF-13/14a/14b/15 (was FAIL-on-HF-9-only + predict-PASS). Terminal-gate status PROVISIONAL until v1.0 admission bar. Stays manual-only (D.3)."

  - name: project-state-reconstructor
    version: "0.2.0"
    status: experimental
    layer: L2-atomic
    class: audit
    owner: research-code-dev
    purpose: >
      Recover verifiable project/workspace facts (entry points, real progress, what runs,
      what is tested) into a state report that cleanly separates FACT from UNKNOWN.
    invocation: manual-only
    auto_trigger: false
    disable_model_invocation: true
    upstream_dependencies: [workspace-forensics-and-inventory]   # PLANNED; self-inventories until built
    downstream_outputs: [state-report]
    conflicts: []
    replaces: null
    replaced_by: null
    write_scope: {read_only: true, creates_new_files: true, may_overwrite: false, may_move: false, may_delete: false, requires_user_approval: false, requires_isolated_branch: false}
    context_budget: {default_reads: [manifests, entry-points, tests, status-dirs], max_scope: "repo via summaries; never a raw whole-repo dump", whole_repo_allowed: false}
    required_tools: [Read, Grep, Glob, Bash]
    norm_sources: [current-dev-status]
    status_vocab: true
    license_sources:
      - {method: "read CONTEXT.md/ADRs before exploring", src: "mattpocock/skills@snapshot tdd, diagnosing-bugs", license: MIT, adoption: method-borrow}
      - {method: "facts recovered, not inherited from old roadmaps", src: "design-guide §2.2", license: internal, adoption: adapt}
    evals: {trigger: pass, conflict: pass, task_quality: pending, reader_test: pending}
    last_evaluated: "2026-07-30"
    notes: "Batch-1 trigger 28/28; e2e demonstrated on messy-workspace fixture (STALE claims caught, no fabrication, E1 discipline). task_quality soft-score run pending. Manual-only (D.3)."

  - name: goal-scope-and-workflow-elicitor
    version: "0.2.0"
    status: experimental
    layer: L2-atomic
    class: audit          # elicits; writes only a scope note
    owner: research-code-dev
    purpose: >
      Structured interview that pins down user goals, scope boundaries, non-goals, and the
      real intended workflow — asking only decisions the user must make, looking up facts itself.
    invocation: orchestrator-only
    auto_trigger: false
    disable_model_invocation: true
    upstream_dependencies: [project-state-reconstructor]
    downstream_outputs: [goal-scope-note, open-decision-list]
    conflicts: [grilling]        # both interview; elicitor owns automatic questioning in flows
    replaces: null
    replaced_by: null
    write_scope: {read_only: false, creates_new_files: true, may_overwrite: false, may_move: false, may_delete: false, requires_user_approval: false, requires_isolated_branch: false}
    context_budget: {default_reads: [state-report], max_scope: "state report + user answers; no repo scan", whole_repo_allowed: false}
    required_tools: [Read, AskUserQuestion]
    norm_sources: []
    status_vocab: true
    license_sources:
      - {method: "one question at a time, recommend an answer, look up facts don't ask them", src: "mattpocock/skills@snapshot grilling", license: MIT, adoption: adapt}
      - {method: "frontier/design-tree rounds", src: "mattpocock/skills@snapshot in-progress/batch-grill-me", license: MIT, adoption: method-borrow}
      - {method: "stop at the decidable boundary; classify open branches", src: "design-guide §6.3", license: internal, adoption: adapt}
    evals: {trigger: pass, conflict: pass, task_quality: pending, reader_test: pending}
    last_evaluated: "2026-07-30"
    notes: "Batch-1 trigger 28/28; correctly declined simple-task + routed manual grilling to grilling. Multi-turn + task_quality runs pending. Manual-only (D.3)."

  - name: uncertainty-and-decision-manager
    version: "0.2.0"
    status: experimental
    layer: L2-atomic
    class: maintain
    owner: research-code-dev
    purpose: >
      Maintain a decision register that tags every item with a status (FACT..STALE) and an
      evidence level (E0..E5), keeping candidates/hypotheses/open questions separate from decided facts.
    invocation: orchestrator-only     # + wayfinder if installed
    auto_trigger: false
    disable_model_invocation: true
    upstream_dependencies: [goal-scope-and-workflow-elicitor, research-evidence-synthesizer]
    downstream_outputs: [decision-register]
    conflicts: [domain-modeling]      # boundary: stable→glossary, unstable→register
    replaces: null
    replaced_by: null
    write_scope: {read_only: false, creates_new_files: true, may_overwrite: false, may_move: false, may_delete: false, requires_user_approval: false, requires_isolated_branch: false}
    context_budget: {default_reads: [decision-register, artifact-under-discussion], max_scope: "register + one artifact", whole_repo_allowed: false}
    required_tools: [Read, Edit, Bash]
    norm_sources: [open-questions, hypotheses, candidates]
    status_vocab: true
    license_sources:
      - {method: "status + evidence-level vocabulary", src: "design-guide §2.3", license: internal, adoption: adopt-verbatim}
      - {method: "decisions are the user's; facts are looked up", src: "mattpocock/skills@snapshot grilling", license: MIT, adoption: method-borrow}
    evals: {trigger: pass, conflict: pass, task_quality: pending, reader_test: pending}
    last_evaluated: "2026-07-30"
    notes: "Batch-1 trigger 28/28; domain-modeling boundary held in all 5 conflict cases; routed code-fact to state-reconstructor. Multi-turn + task_quality (register_check) runs pending. Manual-only (D.3)."

