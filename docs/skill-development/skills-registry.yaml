skills:

  - name: documentation-quality-evaluator
    version: "0.4.1"
    status: experimental
    layer: L2-atomic
    class: evaluate
    owner: research-code-dev
    purpose: >
      Judge a documentation artifact against hard gates (HF-1..HF-15) + a weighted soft/roadmap rubric
      under a non-compensatory rule, run a two-layer no-context reader test, and emit a structured
      DOCUMENT_QUALITY/FACTUAL_VALIDITY verdict. Grades every other skill.
    invocation: orchestrator-only
    auto_trigger: false
    disable_model_invocation: true
    role: advisory-evaluator                  # 2026-08-05 freeze: advisory doc reviewer, NOT a universal auto terminal gate
    terminal_gate_authority: profile-scoped   # an ALLOW is a green terminal gate ONLY within supported_profiles
    supported_profiles: [roadmap, adr, architecture-doc, technical-proposal, evidence-note, evidence-matrix, external-audit, legacy-audit, general-structure-state-evidence-review]
    unsupported_profiles:                      # -> GATE_DECISION=INCOMPLETE / GATE_REASON=unsupported-evaluation-profile
      - "experiment-report + provenance_policy:controlled + decision_mode:release-gate (reproducibility-completeness admission) — Phase-E canary showed stable false-ALLOW"
      - "general experiment reproducibility-release admission; use as a blanket automatic terminal gate"
    upstream_dependencies: []          # runs on any produced doc
    downstream_outputs: [quality-report, reader-test-report]
    conflicts: []                       # read-only gate; composes with all
    replaces: null
    replaced_by: null
    write_scope: {read_only: true, creates_new_files: true, may_overwrite: false, may_move: false, may_delete: false, requires_user_approval: false, requires_isolated_branch: false}
    context_budget: {default_reads: [target-doc, harness/rubric.md, harness/hard-fail.md, harness/canonical-source-map.md], max_scope: "the doc(s) under review + their cited sources", whole_repo_allowed: false}
    required_tools: [Read, Grep, Glob, Bash]     # Bash only to run deterministic checkers
    norm_sources: []
    status_vocab: true
    license_sources:
      - {method: "compact SKILL structure", src: "mattpocock/skills@snapshot writing-great-skills", license: MIT, adoption: method-borrow}
      - {method: "hard-gate vs soft-score separation", src: "design-guide §14.10", license: internal, adoption: adapt}
      - {method: "severity taxonomy + reverse-outline", src: "addyosmani/agent-skills code-review-and-quality + research-paper-writing", license: MIT, adoption: method-borrow}
      - {method: "two-pass adversarial reader", src: "addyosmani/agent-skills doubt-driven-development", license: MIT, adoption: method-borrow}
      - {method: "HF-13/14/15 + HF-12A-E + non-compensatory + structured verdict + 5 signal checkers", src: "reports/documentation-quality-evaluator_独立检查失败复盘与升级要求.md (v0.3 audit)", license: internal, adoption: adapt}
    evals: {trigger: pass, conflict: pass, task_quality: "v0.4 diagnostic 8/8 (13 cases x3=39 runs, dataset_version 4) after the D-16 gate-composition fix; profile-aware HF-9 + two-axis verdict + OQ-REPRO=A confirmed. Phase E 3-arm admission matrix DEFERRED (not a Batch-2 precondition; canary failed -> the unsupported profile is now scoped out to INCOMPLETE).", reader_test: "two-layer protocol authored + anchor reader-failures specified; full standalone run folded into the deferred Phase E"}
    last_evaluated: "2026-08-05"
    notes: "v0.4.1 FROZEN as ADVISORY / profile-scoped (2026-08-05 scope-correction directive). Added a profile-ADMISSION scope guard: unsupported profile (controlled+release-gate experiment-report; general reproducibility-release; blanket auto gate) -> GATE_DECISION=INCOMPLETE / GATE_REASON=unsupported-evaluation-profile. This resolves the halted D-17 canary by SCOPING OUT, not by adopting HF-REPRO — NO HF-1..15 threshold changed. History: 0.3.0->0.4.0 (profile-aware HF-9, two-axis QUALITY_BAND/GATE_DECISION, document_lifecycle vocab, HF-14b profile severity; ADR-DQE-001 ACCEPTED) ->0.4.1 (D-16 gate-composition). Diagnostic 8/8. Stays experimental/manual-only; promotion to a terminal gate is DEFERRED to the future Phase E (see meta.phase_e). Frozen bundles preserved: evals/skills/snapshots/{dqe-v0.3.0,dqe-v0.4.0-pre-d16,dqe-v0.4.1-candidate} (candidate = pre-scope-guard canary bytes; live SKILL.md adds the advisory guard on top)."

